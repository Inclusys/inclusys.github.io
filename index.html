<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UEQ-S Survey</title>

    <!-- Load the Web Component from jsDelivr -->
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/accessible-ueq/dist/ueq-emotion.webcomponent.mjs"
    ></script>

    <style>
      /* Styling for the survey */
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 50px;
      }
      ueq-emotion {
        --ueq-face-size: 4em;
        --ueq-border-highlight: blue;
      }
    </style>
  </head>
  <body>
    <h1>UEQ-S Survey</h1>

    <label for="fileName">User ID:</label>
    <input
      type="text"
      id="fileName"
      placeholder="Enter User ID"
      style="width: 300px; margin-bottom: 20px"
    />

    <form id="survey-form">
      <ueq-emotion
        id="ueq-component"
        name="ueq-survey"
        locale="de_LS"
      ></ueq-emotion>
      <br />
      <input type="submit" value="Submit" style="width: 200px; height: 40px" />
    </form>

    <script>
      document
        .getElementById("survey-form")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent default form submission

          // Get the UEQ-S survey data
          const data = document.querySelector(
            'ueq-emotion[name="ueq-survey"]'
          ).value;
          const userId = document.getElementById("fileName").value;

          // Validate if User ID is provided
          if (!userId) {
            alert("Please enter a User ID before downloading.");
            return;
          }

          // Convert the data to JSON and create a file
          const jsonData = JSON.stringify(data, null, 2);
          const blob = new Blob([jsonData], { type: "application/json" });

          // Create a download link
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `UEQ-S_${userId}.json`;

          // Trigger the download
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        });
    </script>
  </body>
</html>
